// ---------- FORMATTERS ----------
const fmtBRL = (n) => n == null ? "—" : "R$ " + Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 0 });
const fmtMillions = (n) => {
  if (n == null) return "—";
  const m = n / 1_000_000;
  return "R$ " + m.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "M";
};
// Abreviação monetária institucional pt-BR: "R$ 1.733,9 mm" / "R$ 2,1 bi" / "R$ 850 mil"
const fmtBRLAbbr = (n) => {
  if (n == null) return "—";
  const abs = Math.abs(n);
  if (abs >= 1e9) return "R$ " + (n/1e9).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " bi";
  if (abs >= 1e6) return "R$ " + (n/1e6).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " mm";
  if (abs >= 1e3) return "R$ " + (n/1e3).toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + " mil";
  return "R$ " + Number(n).toLocaleString("pt-BR");
};
const fmtPct = (n, decimals=1) => n == null ? "—" : (n*100).toFixed(decimals).replace(".", ",") + "%";
const fmtPctInt = (n) => n == null ? "—" : Math.round(n*100) + "%";
const fmtArea = (n) => n == null ? "—" : Number(n).toLocaleString("pt-BR") + " m²";

const relTime = (iso) => {
  const t = new Date(iso);
  const diffMs = TODAY - t;
  const mins = Math.floor(diffMs / 60000);
  const hours = Math.floor(mins / 60);
  const days = Math.floor(hours / 24);
  if (mins < 60) return `há ${Math.max(1,mins)}min`;
  if (hours < 24) return `há ${hours}h`;
  if (days === 1) return "ontem";
  if (days < 7) return `há ${days}d`;
  if (days < 30) return `há ${Math.floor(days/7)}sem`;
  return `há ${Math.floor(days/30)}mes`;
};

// ---------- DECIMAL INPUT (aceita virgula como separador decimal) ----------
function DecimalInput({ value, onChange, placeholder, style, className, min, max }) {
  const [focused, setFocused] = React.useState(false);
  const [draft, setDraft]     = React.useState("");

  const onFocus = () => {
    setDraft(value === "" || value == null ? "" : String(value).replace(".", ","));
    setFocused(true);
  };
  const onBlur = () => {
    setFocused(false);
    const n = parseFloat(draft.trim().replace(",", "."));
    onChange(isNaN(n) ? "" : String(n));
  };

  return (
    <input
      className={className || "gp-input mono"}
      type="text"
      inputMode="decimal"
      value={focused ? draft : (value === "" || value == null ? "" : String(value).replace(".", ","))}
      onChange={e => setDraft(e.target.value)}
      onFocus={onFocus}
      onBlur={onBlur}
      placeholder={placeholder}
      style={style}
    />
  );
}

// ---------- CURRENCY INPUT ----------
function CurrencyInput({ value, onChange, placeholder, style, className }) {
  const [focused, setFocused] = React.useState(false);
  const [draft, setDraft]     = React.useState("");

  // Formata para exibição quando não está em foco
  const display = React.useMemo(() => {
    if (value === "" || value == null) return "";
    const n = parseFloat(String(value).replace(",", "."));
    return isNaN(n) ? "" : n.toLocaleString("pt-BR", { maximumFractionDigits: 2 });
  }, [value]);

  const onFocus = () => {
    // Ao focar, mostra o valor bruto para edição livre
    setDraft(value === "" || value == null ? "" : String(value).replace(".", ","));
    setFocused(true);
  };

  const onBlur = () => {
    setFocused(false);
    // Aceita vírgula como separador decimal (pt-BR)
    const cleaned = draft.trim().replace(/\./g, "").replace(",", ".");
    const n = parseFloat(cleaned);
    onChange(isNaN(n) ? "" : String(n));
  };

  return (
    <input
      className={className || "gp-input mono"}
      type="text"
      inputMode="decimal"
      value={focused ? draft : display}
      onChange={e => setDraft(e.target.value)}
      onFocus={onFocus}
      onBlur={onBlur}
      placeholder={placeholder}
      style={style}
    />
  );
}

  return (

      <div className="px-4 pt-5 pb-6">

        <div style={{ width: 28, height: 2, background: "#5A98B5", marginTop: 8 }}></div>

// ---------- DASHBOARD ----------
// Sparkline institucional em SVG puro (sem biblioteca de gráficos).
// Consome o histórico do indicador (um ponto por período); < 2 pontos = não renderiza.
function Sparkline({ values, color }) {
  const d = useMemo(() => {
    if (!Array.isArray(values) || values.length < 2) return null;
    const min = Math.min(...values), max = Math.max(...values);
    const n = values.length;
    return values.map((v, i) => {
      const x = (i / (n - 1)) * 78;
      const y = 20 - ((v - min) / (max - min || 1)) * (20 - 3) - 1.5;
      return `${i === 0 ? "M" : "L"}${x},${y}`;
    }).join("");
  }, [values]);
  if (!d) return null;
  const gid = "spark-grad-" + color.replace("#", "");
  return (
    <svg viewBox="0 0 78 20" preserveAspectRatio="none" aria-hidden="true"
      className="block w-full" style={{ height: 20 }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".18" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={d + "L78,20L0,20Z"} fill={`url(#${gid})`} stroke="none" />
      <path d={d} fill="none" stroke={color} strokeWidth="1.25"
        vectorEffect="non-scaling-stroke" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}
Sparkline.propTypes = {
  values: PropTypes.arrayOf(PropTypes.number),
  color: PropTypes.string.isRequired,
};

function KpiCard({ label, value, sub, delta, deltaHint, values, color }) {
  // delta: número = variação %; null = sem base de comparação no período anterior; undefined = não exibir
  const hasDelta = delta !== undefined;
  const deltaStr = !hasDelta ? null
    : delta == null ? "—"
    : `${delta > 0 ? "+" : delta < 0 ? "−" : ""}${Math.abs(delta).toFixed(1).replace(".", ",")}%`;
  const deltaColor = delta == null || delta === 0 ? "#75808A" : delta > 0 ? "#379D9C" : "#A64545";
  return (
    <div className="flex flex-col bg-white border border-[#E5E8EB] rounded-none pt-[13px] px-[15px] pb-[11px]"
      style={{ fontFamily: "'Avenir Next LT Pro','Avenir Next',Avenir,'Segoe UI',Helvetica,Arial,sans-serif" }}>
      <div className="text-[9.5px] uppercase font-semibold tracking-[.1em] text-[#75808A] mb-[6px]">{label}</div>
      <div className="flex items-baseline justify-between gap-2">
        <div className="text-[18px] font-semibold text-[#262626] tracking-[-.01em]" style={{ fontVariantNumeric: "tabular-nums" }}>{value}</div>
        {deltaStr ? (
          <div className="mono text-[11px] font-semibold" style={{ color: deltaColor }}
            title={delta == null ? "Sem base de comparação no período anterior" : (deltaHint || "Variação vs. período anterior")}>
            {deltaStr}
          </div>
        ) : null}
      </div>
      {sub ? <div className="text-[10px] text-[#75808A] mt-[2px]">{sub}</div> : null}
      {Array.isArray(values) && values.length >= 2 ? (
        <div className="mt-auto pt-[6px]"><Sparkline values={values} color={color} /></div>
      ) : null}
    </div>
  );
}
KpiCard.propTypes = {
  label: PropTypes.string.isRequired,
  value: PropTypes.oneOfType([PropTypes.string, PropTypes.number]).isRequired,
  sub: PropTypes.string,
  delta: PropTypes.number,
  deltaHint: PropTypes.string,
  values: PropTypes.arrayOf(PropTypes.number),
  color: PropTypes.string,
};

function Toast({ message }) {
  return (
    <div style={{
      position: "fixed", top: "50%", left: "50%",
      transform: "translate(-50%, -50%)",
      background: "rgba(34, 197, 94, 0.60)",
      backdropFilter: "blur(6px)",
      color: "#fff", fontWeight: 600, fontSize: 16,
      padding: "20px 40px", borderRadius: 14,
      boxShadow: "0 8px 32px rgba(0,0,0,0.18)",
      zIndex: 99999, pointerEvents: "none",
      animation: "toast-in 0.2s ease",
    }}>
      {message}
    </div>
  );
}

function MultiSelect({ options, values, onChange, placeholder, width }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const toggle = (v) => onChange(values.includes(v) ? values.filter(x => x !== v) : [...values, v]);
  const label = values.length === 0
    ? placeholder
    : values.length === 1
      ? (options.find(o => o.value === values[0])?.label || values[0])
      : `${values.length} selecionados`;
  return (
    <div className="relative" ref={ref} style={{ width }}>
      <button
        onClick={() => setOpen(o => !o)}
        className="gp-select w-full flex items-center justify-between gap-1"
        style={{ cursor: "pointer", paddingRight: 8 }}>
        <span className="truncate text-[12px]" style={{ color: values.length === 0 ? "var(--text-2)" : "var(--text)" }}>{label}</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      {open && (
        <div className="absolute right-0 z-50 mt-1 rounded-md p-1 scrollbar"
          style={{ background: "#fff", border: "1px solid var(--border)", boxShadow: "0 8px 24px rgba(20,30,60,.12)", minWidth: "100%", maxHeight: 220, overflowY: "auto" }}>
          {options.map(opt => (
            <label key={opt.value}
              className="flex items-center gap-2 px-3 py-2 rounded text-[12px] cursor-pointer hover:bg-[var(--surface-2)]"
              style={{ color: "var(--text)", userSelect: "none" }}>
              <input type="checkbox" checked={values.includes(opt.value)} onChange={() => toggle(opt.value)}
                style={{ accentColor: "#374856", cursor: "pointer" }} />
              {opt.label}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function DashboardPage({ deals }) {
  const vol = (d) => d.ultimo_valor || 0;
  const [fStatuses, setFStatuses] = useState([]);
  const [fMeses, setFMeses] = useState([]);
  const mesOpts = useMemo(() => {
    const set = new Set(deals.map(d => d.created_at ? d.created_at.slice(0, 7) : null).filter(Boolean));
    return [...set].sort((a, b) => b.localeCompare(a));
  }, [deals]);
  const filtered = deals.filter(d => {
    if (fStatuses.length > 0 && !fStatuses.includes(d.status)) return false;
    if (fMeses.length > 0 && (!d.created_at || !fMeses.includes(d.created_at.slice(0, 7)))) return false;
    return true;
  });
  const countMode = fStatuses.length === 0;

  const fmtTick  = countMode ? (v) => Number(v).toLocaleString('pt-BR') : (v) => `${Number(v).toLocaleString('pt-BR')}M`;
  const fmtTip   = countMode ? (v) => [Number(v).toLocaleString('pt-BR'), "Deals"] : (v) => [`R$ ${Number(v).toLocaleString('pt-BR')}M`, "Volume"];
  const fmtTipN  = countMode ? (v, n) => [Number(v).toLocaleString('pt-BR'), n] : (v, n) => [`R$ ${Number(v).toLocaleString('pt-BR')}M`, n];

  const total = filtered.length;
  const volumeNegoc = filtered.filter(d => d.status === "NEGOCIAÇÕES EM ANDAMENTO").reduce((s,d) => s + vol(d), 0);
  const volume = filtered.reduce((s,d) => s + vol(d), 0);
  const volumeFechadosMes = fMeses.length > 0
    ? filtered.filter(d => d.status === "CONDIÇÕES COMERCIAIS FECHADAS").reduce((s,d) => s + vol(d), 0)
    : filtered.filter(d => d.status === "CONDIÇÕES COMERCIAIS FECHADAS" && new Date(d.updated_at).getMonth() === TODAY.getMonth() && new Date(d.updated_at).getFullYear() === TODAY.getFullYear()).reduce((s,d) => s + vol(d), 0);

  // Histórico mensal de cada indicador (sparklines) — últimos 12 meses com dados
  const ymOf = (iso) => iso ? iso.slice(0, 7) : null;
  const sparkMonths = useMemo(() => {
    const set = new Set(deals.map(d => ymOf(d.created_at)).filter(Boolean));
    return [...set].sort().slice(-12);
  }, [deals]);
  const serieAcum = (pred, val) => sparkMonths.map(ym =>
    filtered.filter(d => pred(d) && ymOf(d.created_at) && ymOf(d.created_at) <= ym).reduce((s, d) => s + val(d), 0));
  const serieTotalDeals = useMemo(() => serieAcum(() => true, () => 1), [filtered, sparkMonths]);
  const serieNegoc = useMemo(() => serieAcum(d => d.status === "NEGOCIAÇÕES EM ANDAMENTO", vol), [filtered, sparkMonths]);
  const serieVolume = useMemo(() => serieAcum(() => true, vol), [filtered, sparkMonths]);
  const serieFech = useMemo(() => sparkMonths.map(ym =>
    filtered.filter(d => d.status === "CONDIÇÕES COMERCIAIS FECHADAS" && ymOf(d.updated_at) === ym).reduce((s, d) => s + vol(d), 0)), [filtered, sparkMonths]);

  // Deltas — meses selecionados vs meses anteriores (created_at), ou mês atual vs anterior (updated_at)
  const curM = TODAY.getMonth(), curY = TODAY.getFullYear();
  const prevM = curM === 0 ? 11 : curM - 1, prevY = curM === 0 ? curY - 1 : curY;
  const inMonth = (d, m, y) => { const dt = new Date(d.created_at); return dt.getMonth() === m && dt.getFullYear() === y; };
  const pctDelta = (curr, prev) => {
    if (prev === 0) return curr === 0 ? 0 : null;  // sem base de comparação no período anterior
    return +((curr - prev) / prev * 100).toFixed(1);
  };

  const prevMonthsForDelta = fMeses.map(ym => {
    const [y, m] = ym.split("-").map(Number);
    return m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2, "0")}`;
  });
  const fmtYm = (ym) => { const [y, m] = ym.split("-").map(Number); return MONTH_NAMES_PT[m-1] + "/" + y; };
  const deltaHint = fMeses.length > 0
    ? `Variação: ${fMeses.map(fmtYm).join(", ")} vs. ${prevMonthsForDelta.map(fmtYm).join(", ")}`
    : `Variação: ${MONTH_NAMES_PT[curM]}/${curY} vs. ${MONTH_NAMES_PT[prevM]}/${prevY}`;
  const deltaBase = fStatuses.length > 0 ? deals.filter(d => fStatuses.includes(d.status)) : deals;
  const inCur  = (d) => fMeses.length > 0 ? !!(d.created_at && fMeses.includes(d.created_at.slice(0,7))) : inMonth(d, curM, curY);
  const inPrev = (d) => fMeses.length > 0 ? !!(d.created_at && prevMonthsForDelta.includes(d.created_at.slice(0,7))) : inMonth(d, prevM, prevY);

  const deltaTotalDeals = pctDelta(
    deltaBase.filter(inCur).length,
    deltaBase.filter(inPrev).length
  );
  const deltaNegoc = pctDelta(
    deltaBase.filter(d => d.status === "NEGOCIAÇÕES EM ANDAMENTO" && inCur(d)).reduce((s,d) => s + vol(d), 0),
    deltaBase.filter(d => d.status === "NEGOCIAÇÕES EM ANDAMENTO" && inPrev(d)).reduce((s,d) => s + vol(d), 0)
  );
  const deltaVolume = pctDelta(
    deltaBase.filter(inCur).reduce((s,d) => s + vol(d), 0),
    deltaBase.filter(inPrev).reduce((s,d) => s + vol(d), 0)
  );
  const deltaFech = pctDelta(
    deltaBase.filter(d => d.status === "CONDIÇÕES COMERCIAIS FECHADAS" && inCur(d)).reduce((s,d) => s + vol(d), 0),
    deltaBase.filter(d => d.status === "CONDIÇÕES COMERCIAIS FECHADAS" && inPrev(d)).reduce((s,d) => s + vol(d), 0)
  );

  // 1. Distribuição por status (volume financeiro R$ M)
  const propostasMap = [
    { status: "NEGOCIAÇÕES EM ANDAMENTO",          label: "Negociação",   color: PALETTE.blue1 },
    { status: "CONDIÇÕES COMERCIAIS FECHADAS",     label: "Fechadas",     color: PALETTE.navy },
    { status: "OPORTUNIDADES DESCARTADAS",         label: "Descartadas",  color: PALETTE.gray1 },
    { status: "OPORTUNIDADES RECEBIDAS",          label: "Recebidas",    color: PALETTE.gray3 },
  ];
  const propostas = propostasMap.map(m => ({
    name: m.label,
    value: countMode
      ? filtered.filter(d => d.status === m.status).length
      : +(filtered.filter(d => d.status === m.status).reduce((s,d) => s + vol(d), 0) / 1_000_000).toFixed(1),
    color: m.color
  }));

  // 2. Volume por tipologia (R$ M)
  const tipologias = {};
  filtered.forEach(d => {
    const k = d.perfil_ativo || "OUTROS";
    tipologias[k] = (tipologias[k] || 0) + (countMode ? 1 : vol(d));
  });
  const volTipologia = Object.entries(tipologias)
    .map(([k, v]) => ({ name: k, value: countMode ? v : +(v/1_000_000).toFixed(1), color: TIPOLOGIA_COLORS[k] || PALETTE.gray3 }))
    .sort((a,b) => b.value - a.value);

  // 3. Forma de aquisição (R$ M) — Dinheiro / Cotas / Misto
  const aquisicaoBuckets = { "Dinheiro": 0, "Cotas": 0, "Misto": 0 };
  filtered.forEach(d => {
    const e = (d.estrategia || "").toUpperCase();
    let bucket = "Misto";
    if (e === "CASH") bucket = "Dinheiro";
    else if (e === "COTAS") bucket = "Cotas";
    else if (e === "CETIPADO" || !e) bucket = "Misto";
    aquisicaoBuckets[bucket] += (countMode ? 1 : vol(d));
  });
  const aquisicao = [
    { name: "Dinheiro", value: countMode ? aquisicaoBuckets["Dinheiro"] : +(aquisicaoBuckets["Dinheiro"]/1_000_000).toFixed(1), color: PALETTE.navy },
    { name: "Cotas",    value: countMode ? aquisicaoBuckets["Cotas"]    : +(aquisicaoBuckets["Cotas"]/1_000_000).toFixed(1),    color: PALETTE.blue3 },
    { name: "Misto",    value: countMode ? aquisicaoBuckets["Misto"]    : +(aquisicaoBuckets["Misto"]/1_000_000).toFixed(1),    color: PALETTE.cyan },
  ];
  const aquisicaoTotal = aquisicao.reduce((s,d) => s + d.value, 0);

  // Volume por UF — filtro global quando ativo, senão apenas "NEGOCIAÇÕES EM ANDAMENTO"
  const ufNegMap = {};
  ((fStatuses.length > 0 || fMeses.length > 0) ? filtered : deals.filter(d => d.status === "NEGOCIAÇÕES EM ANDAMENTO")).forEach(d => {
    const k = d.uf || "N/D";
    ufNegMap[k] = (ufNegMap[k] || 0) + (countMode ? 1 : vol(d));
  });
  const volUFNeg = Object.entries(ufNegMap)
    .map(([k, v]) => ({ name: k, value: countMode ? v : +(v/1_000_000).toFixed(1) }))
    .sort((a, b) => b.value - a.value);

  // 4. Deals originados por broker (R$ M)
  const brokers = {};
  filtered.forEach(d => {
    if (!d.broker_envolvido || !d.nome_broker) return;
    brokers[d.nome_broker] = (brokers[d.nome_broker] || 0) + 1;
  });
  const brokerData = Object.entries(brokers)
    .map(([k, v]) => ({ name: k, value: v }))
    .sort((a,b) => b.value - a.value);

  return (
    <div className="px-8 py-7">
      <div className="flex items-center justify-between mb-1">
        <h1 className="text-[20px] uppercase" style={{ fontWeight: 600, color: "var(--text)", letterSpacing: ".02em" }}>Dashboard</h1>
        <div className="flex items-center gap-3">
          <MultiSelect
            options={mesOpts.map(ym => { const [y,m]=ym.split("-"); return { value: ym, label: `${MONTH_NAMES_PT[+m-1]}/${y}` }; })}
            values={fMeses}
            onChange={setFMeses}
            placeholder="Mês — Todos"
            width={130}
          />
          <MultiSelect
            options={STATUS_ORDER.map(s => ({ value: s, label: STATUS_SHORT[s] || s }))}
            values={fStatuses}
            onChange={setFStatuses}
            placeholder="Status — Todos"
            width={200}
          />
          <div className="text-[12px]" style={{ color: "var(--text-2)" }}>
            <span className="mono">{TODAY.toLocaleDateString("pt-BR", { day: "numeric", month: "short", year: "numeric" })}</span> · visão geral do pipeline
          </div>
        </div>
      </div>
      <div className="text-[13px] mb-6" style={{ color: "var(--text-2)" }}>
        Indicadores consolidados de todos os ativos em pipeline ativo.
      </div>

      {/* KPIs */}
      <div className="grid grid-cols-4 gap-4 mb-6">
        <KpiCard label="Total de Deals" value={total.toLocaleString("pt-BR")} color={PALETTE.navy} sub="Ativos no pipeline" delta={deltaTotalDeals} deltaHint={deltaHint} values={serieTotalDeals} />
        <KpiCard label="Em Negociação" value={fmtBRLAbbr(volumeNegoc)} color={PALETTE.blue1} sub="Volume — negociações em andamento" delta={deltaNegoc} deltaHint={deltaHint} values={serieNegoc} />
        <KpiCard label="Volume Total" value={fmtBRLAbbr(volume)} color={PALETTE.blue3} sub="Soma do último valor enviado" delta={deltaVolume} deltaHint={deltaHint} values={serieVolume} />
        <KpiCard label="Fechados este mês" value={fmtBRLAbbr(volumeFechadosMes)} color={PALETTE.cyan} sub={fMeses.length > 0 ? `Volume fechado · ${fMeses.map(ym => { const [y,m]=ym.split("-"); return MONTH_NAMES_PT[+m-1]+"/"+y; }).join(", ")}` : "Volume fechado total"} delta={deltaFech} deltaHint={deltaHint} values={serieFech} />
      </div>

      {/* Row 1: Propostas + Tipologia */}
      <div className="grid grid-cols-2 gap-4 mb-4">
        <ChartCard
          title="Distribuição de Propostas"
          subtitle={countMode ? "Número de deals por estágio" : "R$ Milhões por estágio"}>
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={propostas} margin={{ top: 14, right: 12, bottom: 4, left: -10 }}>
              <CartesianGrid stroke="#DBE1E5" vertical={false} />
              <XAxis dataKey="name" tick={{ fill: "#6B7F8E", fontSize: 10 }} axisLine={{ stroke: "#BCC6CD" }} tickLine={false} tickFormatter={v => String(v).toUpperCase()} />
              <YAxis tick={{ fill: "#6B7F8E", fontSize: 11, fontFamily: "Poppins" }} axisLine={false} tickLine={false} tickFormatter={fmtTick} />
              <Tooltip cursor={{ fill: "rgba(55,72,86,0.06)" }} formatter={fmtTip} />
              <Bar dataKey="value" animationDuration={200} animationEasing="ease-out">
                {propostas.map((e,i) => <Cell key={i} fill={e.color} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </ChartCard>

        <ChartCard
          title={countMode ? "Deals por Tipologia de Ativo" : "Volume por Tipologia de Ativo"}
          subtitle={countMode ? "Número de deals por tipologia" : "R$ Milhões por tipologia"}>
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={volTipologia} layout="vertical" margin={{ top: 8, right: 24, bottom: 4, left: 8 }}>
              <CartesianGrid stroke="#DBE1E5" horizontal={false} />
              <XAxis type="number" tick={{ fill: "#6B7F8E", fontSize: 11, fontFamily: "Poppins" }} axisLine={{ stroke: "#BCC6CD" }} tickLine={false} tickFormatter={fmtTick} />
              <YAxis type="category" dataKey="name" tick={{ fill: "#374856", fontSize: 11 }} axisLine={false} tickLine={false} width={80} />
              <Tooltip cursor={{ fill: "rgba(55,72,86,0.06)" }} formatter={fmtTip} />
              <Bar dataKey="value" animationDuration={200} animationEasing="ease-out">
                {volTipologia.map((e,i) => <Cell key={i} fill={e.color} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </ChartCard>
      </div>

      {/* Row 2: Aquisição (donut) + Volume por UF em negociação */}
      <div className="grid grid-cols-2 gap-4 mb-4">
        <ChartCard
          title="Forma de Aquisição"
          subtitle={countMode ? "Deals — Dinheiro, Cotas ou Misto" : "R$ Milhões — Dinheiro, Cotas ou Misto"}>
          <div className="flex items-center gap-4" style={{ height: 260 }}>
            <div style={{ width: "55%", height: "100%" }}>
              <ResponsiveContainer>
                <PieChart>
                  <Pie data={aquisicao} dataKey="value" animationDuration={200} animationEasing="ease-out" nameKey="name" innerRadius={62} outerRadius={100} paddingAngle={2} stroke="#FFFFFF" strokeWidth={2}>
                    {aquisicao.map((e,i) => <Cell key={i} fill={e.color} />)}
                  </Pie>
                  <Tooltip formatter={fmtTipN} />
                </PieChart>
              </ResponsiveContainer>
            </div>
            <div className="flex-1 flex flex-col gap-3">
              {aquisicao.map(p => {
                const pct = aquisicaoTotal > 0 ? Math.round(p.value/aquisicaoTotal*100) : 0;
                return (
                  <div key={p.name} className="flex items-center gap-3 text-[12px]">
                    <span className="w-2.5 h-2.5 rounded-sm" style={{ background: p.color }} />
                    <span style={{ color: "var(--text)" }} className="flex-1">{p.name}</span>
                    <span className="mono" style={{ color: "var(--text-2)" }}>
                      {countMode ? Number(p.value).toLocaleString('pt-BR') : `R$ ${Number(p.value).toLocaleString('pt-BR')}M`}
                    </span>
                    <span className="mono" style={{ color: p.color, width: 38, textAlign: "right", fontWeight: 600 }}>{pct}%</span>
                  </div>
                );
              })}
            </div>
          </div>
        </ChartCard>

        <ChartCard
          title={countMode ? "Deals por UF" : "Volume por UF"}
          subtitle={countMode ? "Número de deals — Negociações em andamento" : "R$ Milhões — Negociações em andamento"}>
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={volUFNeg} margin={{ top: 8, right: 12, bottom: 4, left: -10 }}>
              <CartesianGrid stroke="#DBE1E5" vertical={false} />
              <XAxis dataKey="name" tick={{ fill: "#374856", fontSize: 11 }} axisLine={{ stroke: "#BCC6CD" }} tickLine={false} />
              <YAxis tick={{ fill: "#6B7F8E", fontSize: 11, fontFamily: "Poppins" }} axisLine={false} tickLine={false} tickFormatter={fmtTick} />
              <Tooltip cursor={{ fill: "rgba(55,72,86,0.06)" }} formatter={fmtTip} />
              <Bar dataKey="value" animationDuration={200} animationEasing="ease-out" fill={PALETTE.blue1} />
            </BarChart>
          </ResponsiveContainer>
        </ChartCard>
      </div>

      {/* Row 3: Brokers */}
      <div className="grid grid-cols-1 gap-4">
        <ChartCard
          title="Deals Originados por Broker"
          subtitle="Número de deals por broker">
          {brokerData.length === 0 ? (
            <div className="flex items-center justify-center text-[12px]" style={{ height: 200, color: "var(--text-2)" }}>
              Nenhum deal originado via broker no momento.
            </div>
          ) : (
            <ResponsiveContainer width="100%" height={Math.max(220, 60 + brokerData.length * 38)}>
              <BarChart data={brokerData} layout="vertical" margin={{ top: 8, right: 64, bottom: 4, left: 8 }}>
                <CartesianGrid stroke="#DBE1E5" horizontal={false} />
                <XAxis type="number" tick={{ fill: "#6B7F8E", fontSize: 11, fontFamily: "Poppins" }} axisLine={{ stroke: "#BCC6CD" }} tickLine={false} tickFormatter={fmtTick} />
                <YAxis type="category" dataKey="name" tick={{ fill: "#374856", fontSize: 12 }} axisLine={false} tickLine={false} width={150} />
                <Tooltip cursor={{ fill: "rgba(55,72,86,0.06)" }} formatter={fmtTip} />
                <Bar dataKey="value" animationDuration={200} animationEasing="ease-out" fill={PALETTE.blue3} />
              </BarChart>
            </ResponsiveContainer>
          )}
        </ChartCard>
      </div>
    </div>
  );
}

function ChartCard({ title, subtitle, legend, children }) {
  return (
    <div className="g-card rounded-none p-5">
      <div className="flex items-start justify-between mb-4">
        <div>
          <div className="text-[12px] uppercase" style={{ fontWeight: 600, color: "var(--text)", letterSpacing: ".08em" }}>{title}</div>
          {subtitle && <div className="text-[11px] mt-0.5" style={{ color: "var(--text-2)" }}>{subtitle}</div>}
        </div>
        {legend && <div className="flex items-center gap-3">{legend}</div>}
      </div>
      {children}
    </div>
  );
}

function LegendDot({ color, label }) {
  return (
    <div className="flex items-center gap-1.5 text-[11px]" style={{ color: "var(--text-2)" }}>
      <span className="w-2.5 h-2.5 rounded-sm" style={{ background: color }} />
      {label}
    </div>
  );
}

// ---------- DEALS PAGE ----------
const EXPORT_COLS = [
  { key: "id",                    label: "ID" },
  { key: "produto",               label: "Produto" },
  { key: "status",                label: "Status" },
  { key: "responsavel",           label: "Responsável" },
  { key: "perfil_ativo",          label: "Perfil do Ativo" },
  { key: "endereco",              label: "Endereço" },
  { key: "cidade",                label: "Cidade" },
  { key: "uf",                    label: "UF" },
  { key: "area_locavel",          label: "ABL (m²)" },
  { key: "aluguel_mensal",        label: "Aluguel Mensal" },
  { key: "ultimo_valor",          label: "Último Valor" },
  { key: "yield_ultima_proposta", label: "Yield" },
  { key: "estrategia",            label: "Estratégia" },
  { key: "veiculo_oferta",        label: "Veículo da Oferta" },
  { key: "perfil_vendedor",       label: "Perfil Vendedor" },
  { key: "broker_envolvido",      label: "Broker Envolvido" },
  { key: "nome_broker",           label: "Nome Broker" },
  { key: "principais_locatarios", label: "Principais Locatários" },
  { key: "proximos_passos",       label: "Próximos Passos" },
  { key: "historico_negociacoes", label: "Histórico de Negociações" },
  { key: "updated_at",            label: "Atualizado em" },
];

function exportDeals(rows, format) {
  const data = rows.map(d => {
    const row = {};
    EXPORT_COLS.forEach(({ key, label }) => {
      let v = d[key];
      if (key === "broker_envolvido") v = v === true ? "Sim" : v === false ? "Não" : "";
      if (key === "yield_ultima_proposta" && v != null) v = `${(v * 100).toFixed(2).replace(".", ",")}%`;
      row[label] = v ?? "";
    });
    return row;
  });

  const wb = window.XLSX.utils.book_new();
  const ws = window.XLSX.utils.json_to_sheet(data);
  window.XLSX.utils.book_append_sheet(wb, ws, "Deals");

  const filename = `pipeline_${new Date().toISOString().slice(0,10)}`;
  if (format === "csv") {
    const csv = window.XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = filename + ".csv"; a.click();
  } else {
    window.XLSX.writeFile(wb, filename + ".xlsx");
  }
}

function ExportButton({ rows }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen(o => !o)}
        className="flex items-center gap-1.5 px-3.5 py-2 rounded text-[12px] font-medium"

function DealsPage({ deals, setDeals, openDrawer, selectedId, openModal, authFetch }) {
  const [q, setQ] = useState("");
  const [fStatus, setFStatus] = useState([]);
  const [fResp, setFResp] = useState([]);
  const [fPerfil, setFPerfil] = useState([]);
  const [fCidade, setFCidade] = useState([]);
  const [fUF, setFUF] = useState([]);
  const [fBroker, setFBroker] = useState([]);
  const [fMes, setFMes] = useState([]);
  const [posInput, setPosInput] = useState(null); // { dealId, value } — posição sendo editada

  const [deleteTarget, setDeleteTarget] = useState(null); // deal aguardando confirmação de exclusão

  const handleDelete = (e, deal) => {
    e.stopPropagation();
    setDeleteTarget(deal);
  };

  const confirmDelete = async () => {
    const id = deleteTarget.id;
    setDeleteTarget(null);
    await authFetch(`/api/deals/${id}`, { method: "DELETE" });
    setDeals(ds => ds.filter(d => d.id !== id));
  };

  const moveTo = (dealId, targetPos1based) => {
    const myStatus = deals.find(d => d.id === dealId)?.status;
    if (!myStatus) return;
    const group = filtered.filter(d => d.status === myStatus);
    const fromIdx = group.findIndex(d => d.id === dealId);
    if (fromIdx === -1) return;
    const toIdx = Math.max(0, Math.min(group.length - 1, targetPos1based - 1));
    if (fromIdx === toIdx) return;

    const newGroup = [...group];
    const [item] = newGroup.splice(fromIdx, 1);
    newGroup.splice(toIdx, 0, item);

    const base = STATUS_ORDER.indexOf(myStatus) * 10000;
    const nextDeals = deals.map(d => {
      if (d.status !== myStatus) return d;
      const pos = newGroup.findIndex(f => f.id === d.id);
      if (pos === -1) return d; // deal filtrado fora da view → mantém sort_order
      return { ...d, sort_order: base + pos };
    });

    setDeals(nextDeals);
    // só envia os deals visíveis do grupo reordenado
    const updates = newGroup.map((d, i) => ({ id: d.id, sort_order: base + i }));
    authFetch("/api/deals/reorder", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ updates }),
    });
  };

  const cidadeOpts = useMemo(() => [...new Set(deals.map(d => d.cidade).filter(Boolean))].sort(), [deals]);
  const brokerOpts = useMemo(() => [...new Set(deals.map(d => d.nome_broker).filter(Boolean))].sort(), [deals]);
  const mesOpts = useMemo(() => {
    const set = new Set(deals.map(d => d.created_at ? d.created_at.slice(0, 7) : null).filter(Boolean));
    return [...set].sort((a, b) => b.localeCompare(a));
  }, [deals]);
  const ufOpts = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

  const filtered = useMemo(() => {
    return deals
      .filter(d => {
        if (q) {
          const s = q.toLowerCase();
          if (!((d.produto||"").toLowerCase().includes(s) || (d.endereco||"").toLowerCase().includes(s))) return false;
        }
        if (fStatus.length > 0 && !fStatus.includes(d.status)) return false;
        if (fResp.length > 0 && !fResp.includes(d.responsavel)) return false;
        if (fPerfil.length > 0 && !fPerfil.includes(d.perfil_ativo)) return false;
        if (fCidade.length > 0 && !fCidade.includes(d.cidade)) return false;
        if (fUF.length > 0 && !fUF.includes(d.uf)) return false;
        if (fBroker.length > 0 && !fBroker.includes(d.nome_broker)) return false;
        if (fMes.length > 0 && (!d.created_at || !fMes.includes(d.created_at.slice(0, 7)))) return false;
        return true;
      })
      .sort((a, b) => {
        // STATUS_ORDER é SEMPRE primário — nunca pode ser quebrado
        const sa = STATUS_ORDER.indexOf(a.status);
        const sb = STATUS_ORDER.indexOf(b.status);
        if (sa !== sb) return sa - sb;
        // dentro do mesmo status: sort_order manual (se definido)
        const ao = a.sort_order ?? null;
        const bo = b.sort_order ?? null;
        if (ao !== null && bo !== null) return ao - bo;
        if (ao !== null) return -1;
        if (bo !== null) return 1;
        return 0;
      });
  }, [deals, q, fStatus, fResp, fPerfil, fCidade, fUF, fBroker, fMes]);

  return (
    <div className="px-8 py-7">
      <div className="flex items-baseline justify-between mb-5">
        <div>
          <h1 className="text-[20px]" style={{ fontWeight: 600 }}>Deals</h1>
          <div className="text-[13px] mt-1" style={{ color: "var(--text-2)" }}>
            {filtered.length} de {deals.length} deals · clique em uma linha para detalhar
          </div>
        </div>
        <div className="flex items-center gap-2">
          <ExportButton rows={filtered} />
          <button
            onClick={() => openModal(null)}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded text-[12px] font-medium"
            style={{ background: "#374856", color: "#FFFFFF" }}>
            <IconPlus size={14} /> Novo Deal
          </button>
        </div>
      </div>

      {/* toolbar */}
      <div className="flex items-center gap-2.5 mb-4">
        <div className="relative flex-1 max-w-[360px]">
          <span className="absolute left-2.5 top-1/2 -translate-y-1/2" style={{ color: "var(--text-2)" }}><IconSearch size={14}/></span>
          <input
            value={q}
            onChange={e => setQ(e.target.value)}
            className="gp-input"
            style={{ paddingLeft: 30 }}
            placeholder="Buscar por produto ou endereço…"
          />
        </div>
        <MultiSelect options={STATUS_ORDER.map(s => ({ value: s, label: STATUS_SHORT[s] || s }))} values={fStatus} onChange={setFStatus} placeholder="Status — Todos" width={170} />
        <MultiSelect options={RESP_OPTS.map(s => ({ value: s, label: s }))} values={fResp} onChange={setFResp} placeholder="Responsável — Todos" width={160} />
        <MultiSelect options={PERFIL_OPTS.map(s => ({ value: s, label: s }))} values={fPerfil} onChange={setFPerfil} placeholder="Perfil — Todos" width={150} />
        <MultiSelect options={cidadeOpts.map(s => ({ value: s, label: s }))} values={fCidade} onChange={setFCidade} placeholder="Cidade — Todas" width={150} />
        <MultiSelect options={ufOpts.map(s => ({ value: s, label: s }))} values={fUF} onChange={setFUF} placeholder="UF — Todas" width={110} />
        <MultiSelect options={brokerOpts.map(s => ({ value: s, label: s }))} values={fBroker} onChange={setFBroker} placeholder="Broker — Todos" width={150} />
        <MultiSelect options={mesOpts.map(ym => { const [y,m]=ym.split("-"); return { value: ym, label: `${MONTH_NAMES_PT[+m-1]}/${y}` }; })} values={fMes} onChange={setFMes} placeholder="Mês — Todos" width={120} />
        {(q || fStatus.length > 0 || fResp.length > 0 || fPerfil.length > 0 || fCidade.length > 0 || fUF.length > 0 || fBroker.length > 0 || fMes.length > 0) && (
          <button
            onClick={() => { setQ(""); setFStatus([]); setFResp([]); setFPerfil([]); setFCidade([]); setFUF([]); setFBroker([]); setFMes([]); }}

        )}

            {filtered.map((d, fi) => (
              <tr key={d.id}

                  className={`group row-hover cursor-pointer ${selectedId === d.id ? "row-selected" : ""}`}
                  style={{ borderTop: "1px solid var(--border)" }}>
                <td className="px-2 py-3 text-center" onClick={e => e.stopPropagation()}>
                  {(() => {
                    const sameGroup = filtered.filter(x => x.status === d.status);
                    const pos = sameGroup.findIndex(x => x.id === d.id) + 1;
                    const isEditing = posInput?.dealId === d.id;
                    if (isEditing) {
                      return (
                        <input
                          autoFocus
                          type="text"
                          inputMode="numeric"
                          className="mono text-center"

                <td className="px-3 py-3 text-center text-[12px]" style={{ color: "var(--text-2)" }}>{d.broker_envolvido === true ? "Sim" : d.broker_envolvido === false ? "Não" : "—"}</td>

                <td className="px-3 py-3" style={{ color: "var(--text-2)" }}><div className="truncate" style={{ maxWidth: 160 }}>{d.principais_locatarios || "—"}</div></td>
                <td className="px-3 py-3 text-right text-[12px] mono" style={{ color: "var(--text-2)", whiteSpace: "nowrap" }}>{d.created_at ? new Date(d.created_at).toLocaleDateString("pt-BR") : "—"}</td>
                <td className="px-4 py-3 text-right text-[12px] mono" style={{ color: "var(--text-2)", whiteSpace: "nowrap" }}>{relTime(d.updated_at)}</td>
                <td className="px-3 py-3 text-center" onClick={e => e.stopPropagation()}>
                  <button onClick={e => handleDelete(e, d)}

                    style={{ color: "#D9534F" }}
                    title="Apagar deal">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>

                  <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>

            </div>

      )}
    </div>

}

// Componente recursivo: renderiza um item (pasta ou arquivo) e seus filhos
function DriveItem({ item, depth, dealId, authFetch, onRefresh }) {
  const [creating, setCreating] = React.useState(false);
  const [newName, setNewName]   = React.useState("");
  const [saving, setSaving]     = React.useState(false);
  const [open, setOpen]         = React.useState(depth < 2); // pastas de 1º nível já abertas

  const isFolder = item.type === "folder";
  const children = item.children || [];
  const indent   = depth * 14;

  const submitFolder = async () => {
    if (!newName.trim()) return;
    setSaving(true);
    try {
      await authFetch(`/api/deals/${dealId}/drive-folder`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ parent_id: item.id, name: newName.trim() }),
      });
      setNewName(""); setCreating(false);
      onRefresh();

    <a href={item.link} target="_blank" rel="noopener noreferrer"

  return (
    <div>

      {/* Conteúdo expandível */}

                className="flex-1 text-[12px] px-2 py-1 rounded"
                style={{ border: "1px solid var(--border)", outline: "none", background: "var(--surface)" }} />
              <button onClick={submitFolder} disabled={saving}

                style={{ background: "#374856", color: "#fff" }}>

            <DriveItem key={child.id} item={child} depth={depth + 1} dealId={dealId} authFetch={authFetch} onRefresh={onRefresh} />
          ))}
        </div>
      )}
    </div>
  );
}

function FilesTab({ deal, authFetch }) {
  const [data, setData]     = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [creating, setCreating] = React.useState(false); // nova pasta na raiz
  const [newName, setNewName]   = React.useState("");
  const [saving, setSaving]     = React.useState(false);

  const dealId = deal && deal.id;

  const load = () => {
    if (!dealId) return;
    setLoading(true);
    authFetch(`/api/deals/${dealId}/drive-files`)
      .then(r => r.json())
      .then(d => { setData(d); setLoading(false); })
      .catch(() => setLoading(false));
  };

  React.useEffect(() => { load(); }, [dealId]);

  const submitRootFolder = async () => {
    if (!newName.trim() || !data || !data.main_id) return;
    setSaving(true);
    try {
      await authFetch(`/api/deals/${dealId}/drive-folder`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ parent_id: data.main_id, name: newName.trim() }),
      });
      setNewName(""); setCreating(false);
      load();
    } catch (e) { alert("Erro ao criar pasta: " + e.message); }
    finally { setSaving(false); }
  };

  if (!dealId) return (
    <div className="text-[12px] px-3 py-3 rounded-lg mt-1" style={{ color: "var(--text-2)", background: "var(--surface-2)", border: "1px solid var(--border)" }}>
      As pastas do Google Drive serão criadas automaticamente ao salvar o deal.
    </div>
  );

  if (loading && !data) return (
    <div className="text-[12px] px-3 py-3" style={{ color: "var(--text-2)" }}>Carregando arquivos…</div>
  );

  if (!data || !data.main_link) return (
    <div className="text-[12px] px-3 py-3 rounded-lg mt-1" style={{ color: "var(--text-2)", background: "var(--surface-2)", border: "1px solid var(--border)" }}>
      Pasta do Drive ainda não criada para este deal.
    </div>
  );

  const items = data.items || [];

  return (
    <div className="flex flex-col gap-2">
      {/* Pasta principal */}
      <div className="flex items-center gap-2">
        <a href={data.main_link} target="_blank" rel="noopener noreferrer"
          className="flex-1 flex items-center gap-3 px-4 py-3 rounded-lg"
          style={{ background: "rgba(55,72,86,0.06)", border: "1px solid #BCC6CD", textDecoration: "none", color: "#374856" }}>
          <IcoFolder />
          <span className="flex-1 text-[12px] font-semibold">📁 {deal.produto || "Pasta do Deal"}</span>
          <IcoExt />
        </a>
        <button onClick={() => { setCreating(c => !c); setNewName(""); }}
          className="text-[11px] px-3 py-2 rounded font-medium"
          style={{ background: "#EEF1F6", color: "#374856", border: "1px solid #BCC6CD", whiteSpace: "nowrap" }}>
          + Pasta
        </button>
      </div>

      {/* Form nova pasta na raiz */}
      {creating && (
        <div className="flex items-center gap-2 px-3 py-2 rounded-lg" style={{ border: "1px solid var(--border)", background: "var(--surface)" }}>
          <input autoFocus value={newName} onChange={e => setNewName(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") submitRootFolder(); if (e.key === "Escape") setCreating(false); }}
            placeholder="Nome da nova pasta…"
            className="flex-1 text-[12px] px-2 py-1 rounded"
            style={{ border: "1px solid var(--border)", outline: "none" }} />
          <button onClick={submitRootFolder} disabled={saving}
            className="text-[11px] px-3 py-1.5 rounded font-medium"
            style={{ background: "#374856", color: "#fff" }}>
            {saving ? "…" : "Criar"}
          </button>
          <button onClick={() => setCreating(false)} style={{ color: "var(--text-2)" }}>✕</button>
        </div>
      )}

      {/* Árvore de pastas e arquivos */}
      {items.length === 0 ? (
        <div className="text-[12px] px-3 py-2 rounded-lg" style={{ color: "var(--text-2)", background: "var(--surface-2)", border: "1px solid var(--border)" }}>
          Nenhuma pasta ou arquivo encontrado.
        </div>
      ) : (
        <div className="rounded-lg overflow-hidden" style={{ border: "1px solid var(--border)" }}>
          {items.map(item => (
            <DriveItem key={item.id} item={item} depth={0} dealId={dealId} authFetch={authFetch} onRefresh={load} />
          ))}
        </div>
      )}
    </div>
  );
}

function HistoricoNegTab({ deal, authFetch }) {
  const [items, setItems]           = useState([]);
  const [contraMap, setContraMap]   = useState({}); // { offer_id: [contrapropostas] }
  const [loading, setLoading]       = useState(true);
  const [editing, setEditing]       = useState(null);   // null | "new" | item
  const [currentLado, setCurrentLado] = useState("GUARDIAN");
  const [form, setForm]             = useState({});
  const [saving, setSaving]         = useState(false);
  const [cEditing, setCEditing]     = useState(null); // { offerId, item: "new"|obj }
  const [cForm, setCForm]           = useState({});
  const [cSaving, setCSaving]       = useState(false);

  const load = () => {
    Promise.all([
      authFetch(`/api/deals/${deal.id}/historico`).then(r => r.json()),
      authFetch(`/api/deals/${deal.id}/contrapropostas`).then(r => r.json()),
    ]).then(([hist, contra]) => {
      setItems(Array.isArray(hist) ? hist : []);
      const map = {};
      (Array.isArray(contra) ? contra : []).forEach(c => {
        if (!map[c.offer_id]) map[c.offer_id] = [];
        map[c.offer_id].push(c);
      });
      setContraMap(map);
      setLoading(false);
    }).catch(() => setLoading(false));
  };

  useEffect(() => { load(); }, [deal.id]);

  const fmtDate = (iso) => {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
  };

  const openNew = (lado) => { setForm({...EMPTY_HIST}); setEditing("new"); setCurrentLado(lado); };
  const openEdit = (item) => {
    setForm({
      ...item,
      data_negociacao: item.data_negociacao ? item.data_negociacao.slice(0, 10) : (item.created_at ? item.created_at.slice(0, 10) : todayISO()),
      valor_aquisicao: item.valor_aquisicao ?? "",
      cap:             item.cap != null ? +(item.cap * 100).toFixed(4) : "",
      entrada_pct:     item.entrada_pct != null ? +(item.entrada_pct * 100).toFixed(2) : "",
    });
    setEditing(item);
    setCurrentLado(item.lado || "GUARDIAN");
  };
  const cancel = () => { setEditing(null); setForm({}); };

  const toNum = (v, div = 1) => {
    if (v === "" || v == null) return null;
    const n = parseFloat(String(v).replace(",", "."));
    return isNaN(n) ? null : n / div;
  };
  const toPayload = () => ({
    tipo:            form.tipo            || null,
    data_negociacao: form.data_negociacao || null,
    valor_aquisicao: toNum(form.valor_aquisicao),
    cap:             toNum(form.cap, 100),
    modo_pgto:       form.modo_pgto       || null,
    entrada_pct:     toNum(form.entrada_pct, 100),
    parcelamento:    form.parcelamento    || null,
    notas:           form.notas           || null,
  });

  const save = async () => {
    setSaving(true);
    try {
      const payload = toPayload();
      const r = editing === "new"
        ? await authFetch(`/api/deals/${deal.id}/historico`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
          })
        : await authFetch(`/api/historico/${editing.id}`, {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
          });
      if (!r.ok) {
        const raw = await r.text().catch(() => "");
        let detail = String(r.status);
        try { const j = JSON.parse(raw); detail = j.detail || j.message || raw || detail; } catch {}
        alert("Erro ao salvar (" + r.status + "): " + detail.slice(0, 300));
        return;
      }
      cancel(); load();
    } catch (e) {
      alert("Erro de conexão: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  const remove = async (item) => {
    if (!confirm(`Excluir este registro de "${item.tipo || "histórico"}"?`)) return;
    await authFetch(`/api/historico/${item.id}`, { method: "DELETE" });
    load();
  };

  const upd = (k, v) => setForm(f => ({...f, [k]: v}));

  // --- contraproposta handlers ---
  const updC      = (k, v) => setCForm(f => ({...f, [k]: v}));
  const cOpenNew  = (offerId) => { setCForm({...EMPTY_CONTRA}); setCEditing({ offerId, item: "new" }); cancel(); };

      ...c,

      entrada_percentual_contraproposta: c.entrada_percentual_contraproposta != null ? +(c.entrada_percentual_contraproposta * 100).toFixed(2) : "",
    });
    setCEditing({ offerId, item: c });
    cancel();
  };
  const cCancel = () => { setCEditing(null); setCForm({}); };
  const cSave = async () => {
    setCSaving(true);
    try {
      const toNum = (v, div = 1) => {
        if (v === "" || v == null) return null;
        const n = parseFloat(String(v).replace(",", "."));
        return isNaN(n) ? null : n / div;
      };
      const payload = {
        valor_contraproposta:              toNum(cForm.valor_contraproposta),

      const r = cEditing.item === "new"
        ? await authFetch(`/api/historico/${cEditing.offerId}/contrapropostas`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
          })
        : await authFetch(`/api/contrapropostas/${cEditing.item.id}`, {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
          });
      if (!r.ok) {
        const raw = await r.text().catch(() => "");
        let detail = String(r.status);
        try { const j = JSON.parse(raw); detail = j.detail || j.message || raw || detail; } catch {}
        alert("Erro ao salvar contraproposta (" + r.status + "): " + detail.slice(0, 300));
        return;
      }
      cCancel(); load();
    } catch (e) {
      alert("Erro de conexão: " + e.message);
    } finally {
      setCSaving(false);

  const cRemove = async (c) => {

  // InlineForm e ContraForm são componentes top-level (definidos antes desta função)

              <div className="relative flex gap-3">
                <div className="flex flex-col items-center" style={{ width: 18, flexShrink: 0 }}>
                  <div className="w-2.5 h-2.5 rounded-full mt-1.5" style={{ background: colors.text, flexShrink: 0 }} />
                  {(!isLast || (editing === "new" && isThisLado)) && <div className="flex-1 w-px mt-1" style={{ background: "var(--border-2)", minHeight: 12 }} />}
                </div>
                <div className="flex-1 rounded-lg p-3 mb-1" style={{ background: "var(--surface-2)", border: "1px solid var(--border)" }}>
                  <div className="flex items-start justify-between gap-2 mb-2">
                    <div className="flex items-center gap-2 flex-wrap">
                      {item.tipo && (
                        <span className="text-[10px] px-2 py-0.5 rounded font-semibold tracking-wide"
                          style={{ background: colors.bg, color: colors.text, border: `1px solid ${colors.border}` }}>
                          {item.tipo}
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                      <span className="mono text-[10px]" style={{ color: "var(--text-2)" }}>{fmtDate(item.data_negociacao || item.created_at)}</span>
                      <button onClick={() => isEditing ? cancel() : openEdit(item)}
                        className="p-1 rounded hover:bg-[var(--border)]"
                        style={{ color: isEditing ? "#DC2626" : "#374856" }} title="Editar">
                        <IconEdit size={12}/>
                      </button>
                      <button onClick={() => remove(item)} className="p-1 rounded hover:bg-[var(--border)]" style={{ color: "#DC2626" }} title="Excluir">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                  {(item.valor_aquisicao != null || item.cap != null || item.modo_pgto || item.entrada_pct != null) && (
                    <div className="grid grid-cols-2 gap-x-4 gap-y-1.5 mb-2 pb-2" style={{ borderBottom: "1px solid var(--border)" }}>
                      {item.valor_aquisicao != null && <div><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Valor Aquisição</div><div className="mono text-[12px] font-semibold">{fmtBRL(item.valor_aquisicao)}</div></div>}
                      {item.cap != null && <div><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Cap Rate</div><div className="mono text-[12px] font-semibold">{fmtPct(item.cap)}</div></div>}
                      {item.modo_pgto && <div><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Modo Pgto</div><div className="text-[12px]">{item.modo_pgto}</div></div>}
                      {item.entrada_pct != null && <div><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Entrada</div><div className="mono text-[12px]">{fmtPct(item.entrada_pct)}</div></div>}
                    </div>
                  )}
                  {item.parcelamento && <div className="mb-1.5"><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Parcelamento</div><div className="text-[12px]" style={{ whiteSpace: "pre-line" }}>{item.parcelamento}</div></div>}
                  {item.notas && <div className="text-[11px] pt-1.5" style={{ color: "var(--text-2)", borderTop: item.parcelamento ? "1px solid var(--border)" : "none" }}>{item.notas}</div>}
                </div>
              </div>
              {isEditing && <HistInlineForm label="Editar Registro" form={form} upd={upd} save={save} cancel={cancel} saving={saving} />}
            </React.Fragment>
          );
        })}
        {editing === "new" && isThisLado && <HistInlineForm label="Novo Registro" form={form} upd={upd} save={save} cancel={cancel} saving={saving} />}
        {(!editing || !isThisLado || editing !== "new") && !(editing && editing !== "new" && editing.lado === lado) && (
          <button onClick={() => openNew(lado)} className="flex items-center gap-1.5 text-[12px] px-3 py-2 rounded font-medium self-start mt-1"
            style={{ background: "#EEF1F6", color: "#374856", border: "1px solid #BCC6CD" }}>
            <IconPlus size={13}/> Adicionar Registro
          </button>
        )}
      </div>
    );
  };

  if (loading) return <div className="text-[12px] py-4" style={{ color: "var(--text-2)" }}>Carregando histórico…</div>;

  const guardianItems    = items.filter(i => (i.lado || "GUARDIAN") === "GUARDIAN");
  const contraparteItems = items.filter(i => i.lado === "CONTRAPARTE");

  return (
    <div className="flex flex-col gap-3">
      {/* CABEÇALHO 2 colunas */}
      <div className="grid gap-4" style={{ gridTemplateColumns: "1fr 1fr" }}>
        <div className="flex items-center gap-2 pb-2" style={{ borderBottom: "2px solid #374856" }}>
          <div className="w-2 h-2 rounded-full" style={{ background: "#374856" }} />
          <span className="text-[12px] font-semibold uppercase tracking-wide" style={{ color: "#374856" }}>Proposta Guardian</span>
        </div>
        <div className="flex items-center gap-2 pb-2" style={{ borderBottom: "2px solid #1A9FC0", borderLeft: "1px solid var(--border)", paddingLeft: 12 }}>
          <div className="w-2 h-2 rounded-full" style={{ background: "#1A9FC0" }} />
          <span className="text-[12px] font-semibold uppercase tracking-wide" style={{ color: "#1A9FC0" }}>Contraproposta</span>
        </div>
      </div>

      {/* Uma linha por item Guardian: [proposta] | [contrapropostas] */}
      {guardianItems.length === 0 && editing !== "new" && (
        <div className="text-[12px] py-3 px-3 rounded" style={{ color: "var(--text-2)", background: "var(--surface-2)" }}>
          Nenhum registro encontrado.
        </div>
      )}
      {guardianItems.map((item, idx) => {
        const colors    = HIST_TIPO_COLORS[item.tipo] || HIST_TIPO_COLORS["OUTRO"];
        const isLast    = idx === guardianItems.length - 1;
        const isEditing = editing && editing !== "new" && editing.id === item.id;
        const itemContras = contraMap[item.id] || [];
        return (
          <React.Fragment key={item.id}>
            <div className="grid gap-4 items-start" style={{ gridTemplateColumns: "1fr 1fr" }}>
              {/* ESQUERDA: proposta Guardian */}
              <div className="flex gap-3">
                <div className="flex flex-col items-center" style={{ width: 18, flexShrink: 0 }}>
                  <div className="w-2.5 h-2.5 rounded-full mt-1.5" style={{ background: colors.text, flexShrink: 0 }} />
                  {!isLast && <div className="flex-1 w-px mt-1" style={{ background: "var(--border-2)", minHeight: 12 }} />}
                </div>
                <div className="flex-1 rounded-lg p-3 mb-1" style={{ background: "var(--surface-2)", border: "1px solid var(--border)" }}>
                  <div className="flex items-start justify-between gap-2 mb-2">
                    <div className="flex items-center gap-2 flex-wrap">
                      {item.tipo && (
                        <span className="text-[10px] px-2 py-0.5 rounded font-semibold tracking-wide"
                          style={{ background: colors.bg, color: colors.text, border: `1px solid ${colors.border}` }}>
                          {item.tipo}
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                      <span className="mono text-[10px]" style={{ color: "var(--text-2)" }}>{fmtDate(item.data_negociacao || item.created_at)}</span>
                      <button onClick={() => isEditing ? cancel() : openEdit(item)}
                        className="p-1 rounded hover:bg-[var(--border)]"
                        style={{ color: isEditing ? "#DC2626" : "#374856" }} title="Editar">
                        <IconEdit size={12}/>
                      </button>
                      <button onClick={() => remove(item)} className="p-1 rounded hover:bg-[var(--border)]" style={{ color: "#DC2626" }} title="Excluir">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                  {(item.valor_aquisicao != null || item.cap != null || item.modo_pgto || item.entrada_pct != null) && (
                    <div className="grid grid-cols-2 gap-x-4 gap-y-1.5 mb-2 pb-2" style={{ borderBottom: "1px solid var(--border)" }}>
                      {item.valor_aquisicao != null && <div><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Valor Aquisição</div><div className="mono text-[12px] font-semibold">{fmtBRL(item.valor_aquisicao)}</div></div>}
                      {item.cap != null && <div><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Cap Rate</div><div className="mono text-[12px] font-semibold">{fmtPct(item.cap)}</div></div>}
                      {item.modo_pgto && <div><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Modo Pgto</div><div className="text-[12px]">{item.modo_pgto}</div></div>}
                      {item.entrada_pct != null && <div><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Entrada</div><div className="mono text-[12px]">{fmtPct(item.entrada_pct)}</div></div>}
                    </div>
                  )}
                  {item.parcelamento && <div className="mb-1.5"><div className="text-[9px] uppercase tracking-wide mb-0.5" style={{ color: "var(--text-2)" }}>Parcelamento</div><div className="text-[12px]" style={{ whiteSpace: "pre-line" }}>{item.parcelamento}</div></div>}
                  {item.notas && <div className="text-[11px] pt-1.5" style={{ color: "var(--text-2)", borderTop: item.parcelamento ? "1px solid var(--border)" : "none" }}>{item.notas}</div>}
                </div>
              </div>

              {/* DIREITA: contrapropostas desta proposta */}
              <div className="flex flex-col gap-2 pt-0.5" style={{ borderLeft: "1px solid var(--border)", paddingLeft: 12 }}>
                {itemContras.map(c => {
                  const isEditingC = cEditing && cEditing.item !== "new" && cEditing.item?.id === c.id;
                  return (
                    <React.Fragment key={c.id}>
                      <div className="rounded-lg p-2.5" style={{ background: "rgba(49,176,203,0.05)", border: "1px solid rgba(49,176,203,0.2)" }}>
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-[10px] font-semibold uppercase tracking-wide" style={{ color: "#1A9FC0" }}>Contraproposta</span>
                          <div className="flex items-center gap-1">
                            <span className="mono text-[10px]" style={{ color: "var(--text-2)" }}>{fmtDate(c.created_at)}</span>
                            <button onClick={() => isEditingC ? cCancel() : cOpenEdit(item.id, c)}
                              className="p-1 rounded hover:bg-[var(--border)]"
                              style={{ color: isEditingC ? "#DC2626" : "#1A9FC0" }}>
                              <IconEdit size={11}/>
                            </button>
                            <button onClick={() => cRemove(c)} className="p-1 rounded hover:bg-[var(--border)]" style={{ color: "#DC2626" }}>
                              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                              </svg>
                            </button>
                          </div>
                        </div>
                        <div className="grid grid-cols-2 gap-x-3 gap-y-1">
                          {c.valor_contraproposta != null && <div><div className="text-[9px] uppercase" style={{ color: "var(--text-2)" }}>Valor</div><div className="mono text-[11px] font-semibold">{fmtBRL(c.valor_contraproposta)}</div></div>}
                          {c.cap_contraproposta   != null && <div><div className="text-[9px] uppercase" style={{ color: "var(--text-2)" }}>Cap</div><div className="mono text-[11px] font-semibold">{fmtPct(c.cap_contraproposta)}</div></div>}
                          {c.modo_pgto_contraproposta     && <div><div className="text-[9px] uppercase" style={{ color: "var(--text-2)" }}>Pgto</div><div className="text-[11px]">{c.modo_pgto_contraproposta}</div></div>}
                          {c.entrada_percentual_contraproposta != null && <div><div className="text-[9px] uppercase" style={{ color: "var(--text-2)" }}>Entrada</div><div className="mono text-[11px]">{fmtPct(c.entrada_percentual_contraproposta)}</div></div>}
                        </div>
                        {c.parcelamento_contraproposta && <div className="text-[11px] mt-1" style={{ color: "var(--text-2)", whiteSpace: "pre-line" }}>{c.parcelamento_contraproposta}</div>}
                        {c.notas_contraproposta        && <div className="text-[11px] mt-1 italic" style={{ color: "var(--text-2)" }}>{c.notas_contraproposta}</div>}
                      </div>
                      {isEditingC && <HistContraForm cForm={cForm} updC={updC} cSave={cSave} cCancel={cCancel} cSaving={cSaving} />}
                    </React.Fragment>
                  );
                })}
                {!cEditing && !isEditing && (
                  <button onClick={() => cOpenNew(item.id)}
                    className="flex items-center gap-1 text-[11px] px-2.5 py-1.5 rounded self-start"
                    style={{ background: "rgba(49,176,203,0.08)", color: "#1A9FC0", border: "1px solid rgba(49,176,203,0.25)" }}>
                    <IconPlus size={11}/> Contraproposta
                  </button>
                )}
                {cEditing?.item === "new" && cEditing?.offerId === item.id && <HistContraForm cForm={cForm} updC={updC} cSave={cSave} cCancel={cCancel} cSaving={cSaving} />}
              </div>
            </div>
            {isEditing && <HistInlineForm label="Editar Registro" form={form} upd={upd} save={save} cancel={cancel} saving={saving} />}
          </React.Fragment>
        );
      })}

      {/* Form novo registro Guardian */}
      {editing === "new" && currentLado === "GUARDIAN" && <HistInlineForm label="Novo Registro" form={form} upd={upd} save={save} cancel={cancel} saving={saving} />}
      {!editing && (
        <button onClick={() => openNew("GUARDIAN")} className="flex items-center gap-1.5 text-[12px] px-3 py-2 rounded font-medium self-start mt-1"
          style={{ background: "#EEF1F6", color: "#374856", border: "1px solid #BCC6CD" }}>
          <IconPlus size={13}/> Adicionar Registro
        </button>
      )}

      {/* PROPOSTA CONTRAPARTE — seção abaixo */}
      {(contraparteItems.length > 0 || (editing === "new" && currentLado === "CONTRAPARTE")) && (
        <div className="flex flex-col gap-3 mt-3 pt-3" style={{ borderTop: "1px solid var(--border)" }}>
          <div className="flex items-center gap-2 pb-2" style={{ borderBottom: "2px solid #5A98B5" }}>
            <div className="w-2 h-2 rounded-full" style={{ background: "#5A98B5" }} />
            <span className="text-[12px] font-semibold uppercase tracking-wide" style={{ color: "#5A98B5" }}>Proposta Contraparte</span>
          </div>
          <ItemTimeline colItems={contraparteItems} lado="CONTRAPARTE" />
        </div>
      )}
      {!editing && (
        <button onClick={() => openNew("CONTRAPARTE")} className="flex items-center gap-1.5 text-[12px] px-3 py-2 rounded font-medium self-start"
          style={{ background: "#EEF1F6", color: "#5A98B5", border: "1px solid #C7D9F0" }}>
          <IconPlus size={13}/> Proposta Contraparte
        </button>
      )}
    </div>
  );
}

// ---------- PORTFOLIO TAB ----------
const TIPOLOGIA_OPTS = Object.keys(TIPOLOGIA_COLORS).filter(k => k !== "OUTROS");
const UF_OPTS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

function PortfolioInlineForm({ label, form, setForm, save, cancel, saving }) {
  return (
    <div className="rounded-lg p-4 flex flex-col gap-3" style={{ background: "rgba(55,72,86,0.04)", border: "1px solid #BCC6CD" }}>
      <div className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#374856" }}>{label}</div>
      <div className="grid grid-cols-2 gap-3">
        <div className="col-span-2">
          <label className="gp-label">Nome do Imóvel</label>
          <input className="gp-input" value={form.imovel || ""} onChange={e => setForm(f => ({...f, imovel: e.target.value}))} placeholder="Ex.: Galpão Cajamar A" />
        </div>
        <div>
          <label className="gp-label">Tipologia</label>
          <select className="gp-select" value={form.perfil || ""} onChange={e => setForm(f => ({...f, perfil: e.target.value}))}>
            <option value="">Selecione…</option>
            {TIPOLOGIA_OPTS.map(t => <option key={t}>{t}</option>)}
          </select>
        </div>
        <div>
          <label className="gp-label">Aluguel Mensal</label>
          <CurrencyInput value={form.aluguel ?? ""} onChange={v => setForm(f => ({...f, aluguel: v}))} placeholder="0" />
        </div>
        <div>
          <label className="gp-label">Cidade</label>
          <input className="gp-input" value={form.cidade || ""} onChange={e => setForm(f => ({...f, cidade: e.target.value}))} placeholder="Ex.: São Paulo" />
        </div>
        <div>
          <label className="gp-label">UF</label>
          <select className="gp-select" value={form.uf || ""} onChange={e => setForm(f => ({...f, uf: e.target.value}))}>
            <option value="">UF</option>
            {UF_OPTS.map(u => <option key={u}>{u}</option>)}
          </select>
        </div>
        <div className="col-span-2">
          <label className="gp-label">Endereço</label>
          <input className="gp-input" value={form.endereco || ""} onChange={e => setForm(f => ({...f, endereco: e.target.value}))} placeholder="Rua, número" />
        </div>
        <div className="col-span-2">
          <label className="gp-label">ABL (m²)</label>
          <CurrencyInput value={form.abl ?? ""} onChange={v => setForm(f => ({...f, abl: v}))} placeholder="0" />
        </div>
      </div>
      <div className="flex items-center gap-2 justify-end mt-1">
        <button onClick={cancel} className="px-3 py-1.5 rounded text-[12px]" style={{ color: "var(--text-2)" }}>Cancelar</button>
        <button onClick={save} disabled={saving} className="px-4 py-1.5 rounded text-[12px] font-medium" style={{ background: "#374856", color: "#fff" }}>
          {saving ? "Salvando…" : "Salvar"}
        </button>
      </div>
    </div>
  );
}

function PortfolioTab({ deal, authFetch }) {
  const [items, setItems]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);   // null | "new" | item object
  const [form, setForm]       = useState({});
  const [saving, setSaving]   = useState(false);

  const load = async () => {
    setLoading(true);
    const res = await authFetch(`/api/deals/${deal.id}/portfolio`);
    const data = await res.json();
    setItems(Array.isArray(data) ? data : []);
    setLoading(false);
  };

  useEffect(() => { load(); }, [deal.id]);

  const openNew = () => {
    setForm({ perfil: "", imovel: "", aluguel: "", endereco: "", cidade: "", uf: "" , abl: "" });
    setEditing("new");
  };

  const openEdit = (item) => {
    setForm({ ...item, aluguel: item.aluguel ?? "", abl: item.abl ?? "" });
    setEditing(item);
  };

  const cancel = () => { setEditing(null); setForm({}); };

  const save = async () => {
    setSaving(true);
    const payload = {
      perfil:   form.perfil   || null,
      imovel:   form.imovel   || null,
      aluguel:  form.aluguel  !== "" ? Number(form.aluguel)  : null,
      endereco: form.endereco || null,
      cidade:   form.cidade   || null,
      uf:       form.uf       || null,
      abl:      form.abl      !== "" ? Number(form.abl)      : null,
    };
    if (editing === "new") {
      await authFetch(`/api/deals/${deal.id}/portfolio`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
      });
    } else {
      await authFetch(`/api/portfolio/${editing.id}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
      });
    }
    setSaving(false);
    cancel();
    load();
  };

  const remove = async (item) => {
    if (!confirm(`Remover "${item.imovel || "este imóvel"}"?`)) return;
    await authFetch(`/api/portfolio/${item.id}`, { method: "DELETE" });
    load();
  };

  const totalAluguel = items.reduce((s, i) => s + (i.aluguel || 0), 0);
  const totalAbl     = items.reduce((s, i) => s + (i.abl     || 0), 0);

  if (loading) return <div className="text-[12px] py-4" style={{ color: "var(--text-2)" }}>Carregando portfólio…</div>;

  return (
    <div className="flex flex-col gap-4">
      {/* Summary */}
      {items.length > 0 && (
        <div className="grid grid-cols-3 gap-2">
          <div className="p-3 rounded-lg text-center" style={{ background: "var(--surface-2)", border: "1px solid var(--border)" }}>
            <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: "var(--text-2)" }}>Imóveis</div>
            <div className="mono font-semibold" style={{ fontSize: 18 }}>{items.length}</div>
          </div>
          <div className="p-3 rounded-lg text-center" style={{ background: "var(--surface-2)", border: "1px solid var(--border)" }}>
            <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: "var(--text-2)" }}>Aluguel Total</div>
            <div className="mono font-semibold text-[12px]">{fmtBRL(totalAluguel)}</div>
          </div>
          <div className="p-3 rounded-lg text-center" style={{ background: "var(--surface-2)", border: "1px solid var(--border)" }}>
            <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: "var(--text-2)" }}>ABL Total</div>
            <div className="mono font-semibold text-[12px]">{fmtArea(totalAbl)}</div>
          </div>
        </div>
      )}

      <div className="flex flex-col gap-2">
        {items.map(item => (
          <React.Fragment key={item.id}>
            <div className="rounded-lg p-3" style={{ background: "var(--surface-2)", border: "1px solid var(--border)" }}>
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-semibold text-[13px] truncate">{item.imovel || "—"}</span>
                    {item.perfil && (
                      <span className="text-[10px] px-1.5 py-0.5 rounded font-medium"
                        style={{ background: `${TIPOLOGIA_COLORS[item.perfil] || "#93A3AE"}18`, color: TIPOLOGIA_COLORS[item.perfil] || "#93A3AE", border: `1px solid ${TIPOLOGIA_COLORS[item.perfil] || "#93A3AE"}30` }}>
                        {item.perfil}
                      </span>
                    )}
                  </div>
                  <div className="text-[11px] mt-1" style={{ color: "var(--text-2)" }}>
                    {[item.cidade, item.uf].filter(Boolean).join(" / ")}
                    {item.endereco && <span> · {item.endereco}</span>}
                  </div>
                  <div className="flex items-center gap-3 mt-2 flex-wrap">
                    {item.aluguel != null && (
                      <span className="mono text-[11px]" style={{ color: "var(--text)" }}>{fmtBRL(item.aluguel)}<span style={{ color: "var(--text-2)" }}>/mês</span></span>
                    )}
                    {item.abl != null && (
                      <span className="mono text-[11px]" style={{ color: "var(--text-2)" }}>{fmtArea(item.abl)}</span>
                    )}
                  </div>
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  <button onClick={() => editing && editing.id === item.id ? cancel() : openEdit(item)}
                    className="p-1.5 rounded hover:bg-[var(--border)]"
                    style={{ color: editing && editing.id === item.id ? "#DC2626" : "#374856" }} title="Editar">
                    <IconEdit size={13}/>
                  </button>
                  <button onClick={() => remove(item)} className="p-1.5 rounded hover:bg-[var(--border)]" style={{ color: "#DC2626" }} title="Remover">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            {editing && editing !== "new" && editing.id === item.id && (
              <PortfolioInlineForm label="Editar Imóvel" form={form} setForm={setForm} save={save} cancel={cancel} saving={saving} />
            )}
          </React.Fragment>
        ))}

        {items.length === 0 && editing !== "new" && (
          <div className="text-[12px] py-3 px-3 rounded" style={{ color: "var(--text-2)", background: "var(--surface-2)" }}>
            Nenhum imóvel cadastrado neste portfólio.
          </div>
        )}

        {editing === "new" && <PortfolioInlineForm label="Novo Imóvel" form={form} setForm={setForm} save={save} cancel={cancel} saving={saving} />}
      </div>

      {/* Add button */}
      {!editing && (
        <button onClick={openNew} className="flex items-center gap-1.5 text-[12px] px-3 py-2 rounded font-medium self-start"
          style={{ background: "#EEF1F6", color: "#374856", border: "1px solid #BCC6CD" }}>
          <IconPlus size={13}/> Adicionar Imóvel
        </button>
      )}
    </div>
  );
}
